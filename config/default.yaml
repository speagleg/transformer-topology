# config/default.yaml
model:
  embedding_dim: 64
  num_gnn_layers: 4
  num_tat_layers: 4
  num_spatial_heads: 4
  num_spectral_heads: 4
  tat_ff_dim: 256
  dropout: 0.1

training:
  device: auto  # auto | cpu | cuda | cuda:0
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  batch_size: 32
  max_epochs: 100
  patience: 10

benchmark:
  min_hops: 2
  max_hops: 10
  num_distractors: 20
  num_train: 5000
  num_val: 1000
  num_test: 1000

reasoning_loop:
  max_iterations: 7
  convergence_threshold: 0.1
