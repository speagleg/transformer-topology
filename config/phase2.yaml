model:
  embedding_dim: 64
  num_gnn_layers: 4
  num_tat_layers: 4
  num_spatial_heads: 4
  num_spectral_heads: 4
  tat_ff_dim: 256
  dropout: 0.1
  use_higher_order: true
  use_topological_pe: true

training:
  learning_rate: 0.0005
  batch_size: 32
  max_epochs: 30
  patience: 10
  max_norm: 5.0
  accumulation_steps: 4

benchmark:
  tasks:
    - cycle_detection
    - path_counting
    - betti_number
  num_train: 500
  num_val: 100
  num_test: 200
  max_classes: 6
  num_nodes: 10
  max_beta: 5

reasoning_loop:
  max_iterations: 5
  convergence_threshold: 0.1
