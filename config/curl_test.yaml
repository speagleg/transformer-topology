model:
  embedding_dim: 32
  gnn_hidden: 64
  gnn_spatial_layers: 2
  gnn_spectral_layers: 2
  max_freqs: 8
  tat_layers: 2
  tat_spatial_heads: 2
  tat_spectral_heads: 2
  tat_ff_dim: 128
  max_iterations: 3
  convergence_threshold: 0.1
  use_wave_dynamics: false
  use_higher_order: true
  use_topological_pe: true
  use_structural_features: true

training:
  device: auto
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  epochs: 10
  patience: 5
  max_norm: 5.0
  accumulation_steps: 1

benchmark:
  tier: 1
  seed: 42
  train_n_nodes: 16
  test_n_nodes: [16]
  train_topologies: [ba, ws, er]
  test_topologies: [grid, tree]
  num_train: 200
  num_val: 50
  num_test: 100
  model_variants: [hierarchical]
  collect_diagnostics: true
  output_dir: data/curl_test_results
