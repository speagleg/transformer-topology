# config/v7_metacognition.yaml
# Phase 7: Meta-Cognition — ConceptNet grounded reasoning with real Qwen

model:
  embedding_dim: 32
  gnn_hidden: 64
  gnn_spatial_layers: 2
  gnn_spectral_layers: 2
  max_freqs: 16
  tat_layers: 2
  tat_spatial_heads: 4
  tat_spectral_heads: 4
  tat_ff_dim: 128
  max_iterations: 2           # was 5 — 2 Qwen forwards/sample (2.5x speedup)
  convergence_threshold: 0.05
  use_higher_order: true
  use_topological_pe: true
  use_structural_features: true
  use_wave_dynamics: true
  use_topo_feedback: true
  use_embedding_topo_feedback: true
  use_multi_head_classifier: true

wave:
  wave_mode: ensemble
  filter_types: [chebyshev, wave_cosine, heat]
  include_identity: true
  wave_strength_gate: true
  use_neural_ode: true

llm:
  backend: qwen
  qwen_model: Qwen/Qwen2.5-3B-Instruct
  llm_dim: 2048
  num_tokens: 16
  adapter_layers: 2
  extract_layer: 16
  num_tasks: 19  # 14 original + 5 KG tasks
  use_mock: false  # Real Qwen for Phase D

training:
  device: auto
  learning_rate: 0.0003        # was 0.001 — gentle fine-tune for pre-trained GNN/TAT
  adapter_learning_rate: 0.001  # was 0.0001 — 10x boost, adapter must learn text features
  bridge_learning_rate: 0.0005  # was 0.0001 — 5x boost for bridge decoder
  weight_decay: 0.01
  label_smoothing: 0.1
  batch_size: 8
  use_batched: true
  epochs_phase_a: 30
  epochs_phase_b: 30
  epochs_phase_c: 30
  epochs_phase_d: 40
  patience: 20                 # was 10 — give adapter warmup time
  max_norm: 5.0
  accumulation_steps: 4
  replay_ratio: 0.5
  use_class_weights: true
  contrastive_loss_weight: 0.1

topology_observer:
  enabled: true
  analyze_every: 5
  active_mode: true
  dsm_num_heads: 16
  dsm_hidden_dim: 2048

benchmark:
  train_samples: 5000
  val_samples: 500
  test_samples: 200
  train_n_nodes: 20
  train_n_nodes_min: 16
  train_n_nodes_max: 32
  test_n_nodes: [20, 40, 80]
  train_topologies: [ba, ws, grid, tree, ladder, sbm]
  test_topologies: [er, caveman]
  checkpoint_dir: data/v6_track2/checkpoints
  pregen_dir: data/dsm_datasets
  conceptnet_path: data/conceptnet/conceptnet_en.pkl

# Phase D: KG tasks requiring multi-modal fusion
phase_d:
  tasks: [kg_relation, kg_concept, kg_pathvalid, kg_analogy, kg_cluster]
  epochs:
    kg_relation: 25            # was 10 — adapter needs more time
    kg_concept: 20             # was 8
    kg_pathvalid: 20           # was 8
    kg_analogy: 20             # was 8
    kg_cluster: 15             # was 6
  kg_train_samples: 5000
  kg_val_samples: 500
  replay_structural_ratio: 0.2
  replay_semantic_ratio: 0.1
  semantic_weight_init: -1.0   # override loaded bias (sigmoid≈0.27), let text features in
  resume_from: data/v6_track2/checkpoints/phase_c_labeled_reasoning_best.pt
