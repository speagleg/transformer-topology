model:
  embedding_dim: 32
  gnn_hidden: 64
  gnn_spatial_layers: 2
  gnn_spectral_layers: 2
  max_freqs: 8
  tat_layers: 2
  tat_spatial_heads: 2
  tat_spectral_heads: 2
  tat_ff_dim: 128
  max_iterations: 5
  convergence_threshold: 0.1
  use_wave_dynamics: true
  use_higher_order: true
  use_topological_pe: true
  use_structural_features: true

training:
  device: auto
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  epochs: 30
  patience: 10
  max_norm: 5.0
  accumulation_steps: 4

clrs:
  task_types: [bfs, dijkstra]
  max_distance: 16
  max_edge_weight: 5
  train_size: 16
  test_sizes: [16, 32, 64]
  num_train: 1000
  num_val: 200
  num_test: 200
