model:
  embedding_dim: 32
  gnn_hidden: 64
  gnn_spatial_layers: 2
  gnn_spectral_layers: 2
  max_freqs: 8
  tat_layers: 2
  tat_spatial_heads: 2
  tat_spectral_heads: 2
  tat_ff_dim: 128
  max_iterations: 5
  convergence_threshold: 0.1
  use_wave_dynamics: true
  use_higher_order: true
  use_topological_pe: true
  use_structural_features: true

wave:
  filter_type: heat            # heat, bandpass, wave_cosine, chebyshev, schrodinger, wavelet
  wave_mode: spectral          # spectral (single filter), sheaf, ensemble (multi-filter)
  laplacian_dim: 0             # 0=node, 1=edge, 2=face
  wave_strength_gate: true     # learnable bypass gate (benchmark: let model learn to skip waves)
  use_neural_ode: true         # WavePropagation ODE alongside spectral filter
  # Ensemble mode (wave_mode: ensemble):
  # filter_types: [chebyshev, wave_cosine, heat]
  # include_identity: true     # adds nowave path
  # include_sheaf: true        # adds sheaf diffusion path

llm:
  enabled: false
  llm_dim: 128               # small for CPU testing; 2048 for real Llama
  num_prefix: 4
  gate_threshold: 0.1
  mock_hidden: 64

training:
  device: auto
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  epochs: 50
  patience: 7
  max_norm: 5.0
  accumulation_steps: 4

benchmark:
  tier: 1
  seed: 42
  train_n_nodes: 20
  train_n_nodes_min: 16
  train_n_nodes_max: 32
  test_n_nodes: [20, 40, 80]
  train_topologies: [ba, ws, sbm, er]
  test_topologies: [grid, tree, ladder, caveman]
  num_train: 5000
  num_val: 1000
  num_test: 2000
  model_variants: [hierarchical, hierarchical_nowave]
  collect_diagnostics: true
  output_dir: data/benchmark_results
  checkpoint_dir: data/benchmark_checkpoints
