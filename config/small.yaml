model:
  embedding_dim: 32
  gnn_hidden: 64
  gnn_spatial_layers: 2
  gnn_spectral_layers: 2
  max_freqs: 8
  tat_layers: 2
  tat_spatial_heads: 2
  tat_spectral_heads: 2
  tat_ff_dim: 128
  max_iterations: 3
  convergence_threshold: 0.1
  use_wave_dynamics: true
  use_higher_order: true
  use_topological_pe: true
  use_structural_features: true

training:
  device: auto  # auto | cpu | cuda | cuda:0
  learning_rate: 0.001
  weight_decay: 0.01
  label_smoothing: 0.1
  epochs: 30
  patience: 10
  max_norm: 5.0
  accumulation_steps: 4

data:
  task_type: diverse
  min_hops: 2
  max_hops: 10
  num_distractors: 20
  num_train: 1000
  num_test: 200
  n_nodes_range: [30, 80]
  n_nodes: 20
  max_delay: 10
  max_edge_delay: 5
  use_diverse_topology: true
